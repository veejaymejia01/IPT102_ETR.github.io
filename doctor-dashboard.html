<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Doctor Dashboard - CareFlow</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="dashboard-container">
    <nav class="sidebar">
      <h2>CareFlow</h2>
      <ul>
        <li onclick="showSection('schedule')">My Schedule</li>
        <li onclick="showSection('book')">Book Appointment</li>
        <li onclick="showSection('patients')">My Patients</li>
        <li onclick="showSection('email')">Send Email</li>
      </ul>
      <button onclick="logout()">Logout</button>
    </nav>

    <main class="content">
      <!-- My Schedule -->
      <div id="schedule" class="section">
        <h1>My Appointments</h1>
        <div id="doctor-appointments"></div>
      </div>

      <!-- Book Appointment -->
      <div id="book" class="section hidden">
        <h1>Schedule New Appointment</h1>
        <form id="book-form">
          <input type="text" id="patientName" placeholder="Patient Name" required>
          <input type="datetime-local" id="appointmentDate" required>
          <button type="submit">Book</button>
        </form>
      </div>

      <!-- My Patients -->
      <div id="patients" class="section hidden">
        <h1>My Patients</h1>
        <button onclick="addPatient()">Add Patient</button>
        <div id="doctor-patients-list"></div>
      </div>

      <!-- Send Email -->
      <div id="email" class="section hidden">
        <h1>Send Email Notification</h1>
        <select id="emailPatient"></select>
        <input id="emailSubject" placeholder="Subject">
        <textarea id="emailMessage" placeholder="Message"></textarea>
        <button onclick="sendDoctorEmail()">Send</button>
      </div>
    </main>
  </div>

  <script>
    const API = "https://etr-backend.onrender.com/api";

    function showSection(section) {
      document.querySelectorAll('.section').forEach(s => s.classList.add('hidden'));
      document.getElementById(section).classList.remove('hidden');
      if (section === 'schedule') loadDoctorAppointments();
      if (section === 'patients') loadDoctorPatients();
    }

    async function loadDoctorAppointments() {
      // Fetch doctor's appointments (add doctor_id filter in backend if needed)
      const res = await fetch(`${API}/appointments`, { headers: { Authorization: `Bearer ${localStorage.getItem('healthcare_token')}` } });
      const data = await res.json();
      document.getElementById('doctor-appointments').innerHTML = `<pre>${JSON.stringify(data, null, 2)}</pre>`;
    }

    async function loadDoctorPatients() {
      const res = await fetch(`${API}/patients`, { headers: { Authorization: `Bearer ${localStorage.getItem('healthcare_token')}` } });
      const data = await res.json();
      document.getElementById('doctor-patients-list').innerHTML = `<pre>${JSON.stringify(data, null, 2)}</pre>`;
    }

    async function addPatient() {
      const name = prompt("Patient Name");
      if (!name) return;
      const res = await fetch(`${API}/patients`, {
        method: "POST",
        headers: { "Content-Type": "application/json", Authorization: `Bearer ${localStorage.getItem('healthcare_token')}` },
        body: JSON.stringify({ name })
      });
      alert("Patient added");
      loadDoctorPatients();
    }

    async function sendDoctorEmail() {
      const patientId = document.getElementById("emailPatient").value;
      const subject = document.getElementById("emailSubject").value;
      const message = document.getElementById("emailMessage").value;
      // Call /api/email/send
      alert("Email sent (check backend)");
    }

    function logout() {
      localStorage.clear();
      location.href = "index.html";
    }

    window.onload = () => showSection('schedule');
  </script>
</body>
</html>
