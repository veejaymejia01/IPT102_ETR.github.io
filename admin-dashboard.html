
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard - CareFlow</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="app-shell">
    <!-- Sidebar -->
    <div class="sidebar">
      <div class="brand">
        <div class="brand-icon">●</div>
        <div><h1>CareFlow</h1><p>Admin Portal</p></div>
      </div>
      
      <div class="nav-list">
        <button class="nav-btn active" onclick="showAdminPage('appointments', this)">📅 Appointments</button>
        <button class="nav-btn" onclick="showAdminPage('patients', this)">👥 Patients</button>
        <button class="nav-btn" onclick="showAdminPage('notifications', this)">✉️ Notifications</button>
      </div>

      <button onclick="logout()" class="logout-btn">🚪 Logout</button>
    </div>

    <!-- Main Content -->
    <div class="main">

      <!-- Appointments -->
      <section id="appointments">
        <div class="page-hero"><h2>Appointments</h2></div>
        <div class="metrics">
          <div class="metric-card"><small>Today</small><strong id="todayCount">0</strong></div>
          <div class="metric-card"><small>Selected</small><strong id="selectedCount">0</strong></div>
          <div class="metric-card"><small>This Month</small><strong id="monthCount">0</strong></div>
        </div>
        <div class="grid-2">
          <div class="panel">
            <h3 id="calendarTitle">Calendar</h3>
            <div id="calendarGrid" class="calendar-grid"></div>
          </div>
          <div class="panel">
            <h3 id="selectedDateTitle">Selected Day</h3>
            <div id="selectedAppointments"></div>
          </div>
        </div>
      </section>

      <!-- Patients -->
      <section id="patients" class="hidden">
        <div class="page-hero"><h2>Patients</h2></div>
        <div class="panel">
          <h3>Patients List</h3>
          <table id="patientTable">
            <thead><tr><th>Name</th><th>Contact</th><th>Condition</th><th>Appointments</th><th>Actions</th></tr></thead>
            <tbody></tbody>
          </table>
        </div>
        <div class="panel schedule-card">
          <h3>Schedule Appointment</h3>
          <select id="schedulePatient"></select>
          <input type="datetime-local" id="scheduleDate">
          <div id="adminTimeSlots" class="time-grid"></div>
          <button onclick="scheduleSelectedPatient()" class="btn btn-primary">Schedule</button>
        </div>
      </section>

      <!-- Notifications -->
      <section id="notifications" class="hidden">
        <div class="page-hero"><h2>Notifications</h2></div>
        <div class="panel">
          <h3>Send Notification</h3>
          <select id="notificationPatient"></select>
          <textarea id="notificationMessage" placeholder="Message..."></textarea>
          <button onclick="sendEmailNotification()" class="btn btn-primary">Send Email</button>
        </div>
      </section>
    </div>
  </div>

  <script src="admin.js"></script>
</body>
</html>
