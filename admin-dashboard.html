<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard - CareFlow</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="dashboard-container">
    <nav class="sidebar">
      <h2>CareFlow</h2>
      <ul>
        <li onclick="showSection('overview')">Overview</li>
        <li onclick="showSection('specializations')">Specializations</li>
        <li onclick="showSection('patients')">Patients</li>
      </ul>
      <button onclick="logout()">Logout</button>
    </nav>

    <main class="content">
      <!-- Overview -->
      <div id="overview" class="section">
        <h1>Dashboard Overview</h1>
        <div id="all-appointments"></div>
      </div>

      <!-- Specializations -->
      <div id="specializations" class="section hidden">
        <h1>Appointments by Specialization</h1>
        <div id="specialization-list"></div>
      </div>

      <!-- Patients -->
      <div id="patients" class="section hidden">
        <h1>All Patients</h1>
        <div id="patients-list"></div>
      </div>
    </main>
  </div>

  <script>
    const API = "https://etr-backend.onrender.com/api";

    function showSection(section) {
      document.querySelectorAll('.section').forEach(s => s.classList.add('hidden'));
      document.getElementById(section).classList.remove('hidden');
      if (section === 'overview') loadAllAppointments();
      if (section === 'specializations') loadSpecializations();
      if (section === 'patients') loadPatients();
    }

    async function loadAllAppointments() {
      const res = await fetch(`${API}/appointments`, { headers: { Authorization: `Bearer ${localStorage.getItem('healthcare_token')}` } });
      const data = await res.json();
      document.getElementById('all-appointments').innerHTML = `<pre>${JSON.stringify(data, null, 2)}</pre>`;
    }

    async function loadSpecializations() {
      const res = await fetch(`${API}/specializations`);
      const specs = await res.json();
      let html = '';
      for (const spec of specs) {
        html += `<div class="spec-card"><h3>${spec.name}</h3><button onclick="loadAppointmentsBySpec('${spec.id}')">View Appointments</button></div>`;
      }
      document.getElementById('specialization-list').innerHTML = html;
    }

    async function loadAppointmentsBySpec(specId) {
      const res = await fetch(`${API}/appointments/specialization/${specId}`, { headers: { Authorization: `Bearer ${localStorage.getItem('healthcare_token')}` } });
      const data = await res.json();
      alert(JSON.stringify(data, null, 2));
    }

    async function loadPatients() {
      const res = await fetch(`${API}/patients`, { headers: { Authorization: `Bearer ${localStorage.getItem('healthcare_token')}` } });
      const data = await res.json();
      document.getElementById('patients-list').innerHTML = `<pre>${JSON.stringify(data, null, 2)}</pre>`;
    }

    function logout() {
      localStorage.clear();
      location.href = "index.html";
    }

    // Load Overview by default
    window.onload = () => showSection('overview');
  </script>
</body>
</html>
