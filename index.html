<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Healthcare Portal</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f6f9;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
    }

    .login-card {
      background: #fff;
      padding: 30px;
      border-radius: 10px;
      width: 350px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.08);
    }

    h2 {
      margin-bottom: 5px;
    }

    p {
      color: #666;
      margin-bottom: 20px;
      font-size: 14px;
    }

    input {
      width: 100%;
      padding: 12px;
      margin-bottom: 15px;
      border-radius: 6px;
      border: 1px solid #ccc;
      font-size: 14px;
    }

    .password-wrapper {
      position: relative;
    }

    .password-wrapper input {
      padding-right: 60px;
    }

    .password-toggle {
      position: absolute;
      right: 10px;
      top: 50%;
      transform: translateY(-50%);
      border: none;
      background: transparent;
      color: #007bff;
      font-size: 13px;
      cursor: pointer;
      font-weight: 600;
    }

    button {
      width: 100%;
      padding: 12px;
      background: #007bff;
      color: #fff;
      border: none;
      border-radius: 6px;
      font-size: 15px;
      cursor: pointer;
    }

    button:hover {
      background: #0056b3;
    }

    .error {
      color: red;
      font-size: 13px;
      margin-top: 10px;
    }

    .switch {
      margin-top: 15px;
      text-align: center;
      font-size: 13px;
    }

    .switch span {
      color: #007bff;
      cursor: pointer;
    }
  </style>
</head>

<body>

  <div class="login-card">

    <!-- LOGIN -->
    <div id="loginSection">
      <h2>Welcome back</h2>
      <p>Sign in to your healthcare portal</p>

      <input id="loginEmail" type="email" placeholder="Email" />

      <div class="password-wrapper">
        <input id="loginPassword" type="password" placeholder="Password" />
        <button
          type="button"
          class="password-toggle"
          id="toggleLoginPassword"
          onclick="togglePassword('loginPassword','toggleLoginPassword')"
        >
          Show
        </button>
      </div>

      <button onclick="login()">Sign In</button>

      <div id="loginError" class="error"></div>

      <div class="switch">
        Don't have an account?
        <span onclick="showRegister()">Register</span>
      </div>
    </div>

    <!-- REGISTER -->
    <div id="registerSection" style="display:none;">
      <h2>Create account</h2>
      <p>Register as a patient</p>

      <input id="registerName" placeholder="Full name" />
      <input id="registerEmail" type="email" placeholder="Email" />

      <div class="password-wrapper">
        <input id="registerPassword" type="password" placeholder="Password" />
        <button
          type="button"
          class="password-toggle"
          id="toggleRegisterPassword"
          onclick="togglePassword('registerPassword','toggleRegisterPassword')"
        >
          Show
        </button>
      </div>

      <input id="registerPhone" placeholder="Phone number" />

      <button onclick="registerPatient()">Register</button>

      <div id="registerError" class="error"></div>

      <div class="switch">
        Already have an account?
        <span onclick="showLogin()">Login</span>
      </div>
    </div>

  </div>

  <script src="auth.js"></script>

  <script>
    function showRegister() {
      document.getElementById("loginSection").style.display = "none";
      document.getElementById("registerSection").style.display = "block";
    }

    function showLogin() {
      document.getElementById("registerSection").style.display = "none";
      document.getElementById("loginSection").style.display = "block";
    }
  </script>

</body>
</html>
