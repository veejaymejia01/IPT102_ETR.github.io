<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Healthcare Portal</title>


</head>

<body>

  <div class="login-card">

    <!-- LOGIN -->
    <div id="loginSection">
      <h2>Welcome back</h2>
      <p>Sign in to your healthcare portal</p>

      <input id="loginEmail" type="email" placeholder="Email" />

      <div class="password-wrapper">
        <input id="loginPassword" type="password" placeholder="Password" />
        <button
          type="button"
          class="password-toggle"
          id="toggleLoginPassword"
          onclick="togglePassword('loginPassword','toggleLoginPassword')"
        >
          Show
        </button>
      </div>

      <button onclick="login()">Sign In</button>

      <div id="loginError" class="error"></div>

      <div class="switch">
        Don't have an account?
        <span onclick="showRegister()">Register</span>
      </div>
    </div>

    <!-- REGISTER -->
    <div id="registerSection" style="display:none;">
      <h2>Create account</h2>
      <p>Register as a patient</p>

      <input id="registerName" placeholder="Full name" />
      <input id="registerEmail" type="email" placeholder="Email" />

      <div class="password-wrapper">
        <input id="registerPassword" type="password" placeholder="Password" />
        <button
          type="button"
          class="password-toggle"
          id="toggleRegisterPassword"
          onclick="togglePassword('registerPassword','toggleRegisterPassword')"
        >
          Show
        </button>
      </div>

      <input id="registerPhone" placeholder="Phone number" />

      <button onclick="registerPatient()">Register</button>

      <div id="registerError" class="error"></div>

      <div class="switch">
        Already have an account?
        <span onclick="showLogin()">Login</span>
      </div>
    </div>

  </div>

  <script src="auth.js"></script>

  <script>
    function showRegister() {
      document.getElementById("loginSection").style.display = "none";
      document.getElementById("registerSection").style.display = "block";
    }

    function showLogin() {
      document.getElementById("registerSection").style.display = "none";
      document.getElementById("loginSection").style.display = "block";
    }
  </script>

</body>
</html>
