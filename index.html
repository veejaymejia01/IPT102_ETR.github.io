<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Healthcare Portal</title>
  

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f6f9;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
    }

    .login-card {
      background: #fff;
      padding: 30px;
      border-radius: 10px;
      width: 350px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.08);
    }

    h2 {
      margin-bottom: 5px;
    }

    p {
      color: #666;
      margin-bottom: 20px;
      font-size: 14px;
    }

    input {
      width: 100%;
      padding: 12px;
      margin-bottom: 15px;
      border-radius: 6px;
      border: 1px solid #ccc;
      font-size: 14px;
      box-sizing: border-box;
    }

    .password-wrapper {
      position: relative;
    }

    .password-wrapper input {
      padding-right: 60px;
    }

    .password-toggle {
      position: absolute;
      right: 10px;
      top: 38%;
      transform: translateY(-50%);
      border: none;
      background: transparent;
      color: #007bff;
      font-size: 13px;
      cursor: pointer;
      font-weight: 600;
      width: auto;
      padding: 0;
    }

    .remember-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 15px;
      font-size: 13px;
      color: #555;
    }

    .remember-row input {
      width: auto;
      margin: 0;
    }

    button {
      width: 100%;
      padding: 12px;
      background: #007bff;
      color: #fff;
      border: none;
      border-radius: 6px;
      font-size: 15px;
      cursor: pointer;
    }

    button:hover {
      background: #0056b3;
    }

    button:disabled {
      opacity: 0.7;
      cursor: not-allowed;
    }

    .switch {
      margin-top: 15px;
      text-align: center;
      font-size: 13px;
    }

    .switch span {
      color: #007bff;
      cursor: pointer;
    }

    .spinner {
      display: inline-block;
      width: 14px;
      height: 14px;
      border: 2px solid rgba(255,255,255,0.5);
      border-top-color: white;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      vertical-align: middle;
      margin-right: 8px;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .toast {
      position: fixed;
      top: 20px;
      right: 20px;
      background: #111827;
      color: white;
      padding: 14px 18px;
      border-radius: 8px;
      font-size: 14px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.15);
      opacity: 0;
      transform: translateY(-10px);
      pointer-events: none;
      transition: 0.25s ease;
      z-index: 9999;
    }

    .toast.show {
      opacity: 1;
      transform: translateY(0);
    }

    .toast.success {
      background: #15803d;
    }

    .toast.error {
      background: #dc2626;
    }
  </style>
</head>

<body>
  <div id="toast" class="toast"></div>

  <div class="login-card">

    <div id="loginSection">
      <h2>Welcome back</h2>
      <p>Sign in to your healthcare portal</p>

      <input id="loginEmail" type="email" placeholder="Email" />

      <div class="password-wrapper">
        <input id="loginPassword" type="password" placeholder="Password" />
        <button
          type="button"
          class="password-toggle"
          id="toggleLoginPassword"
          onclick="togglePassword('loginPassword','toggleLoginPassword')"
        >
          Show
        </button>
      </div>

      <label class="remember-row">
        <input id="rememberMe" type="checkbox" />
        Remember login
      </label>

      <button id="loginBtn" onclick="login()">
        Sign In
      </button>

      <div class="switch">
        Don't have an account?
        <span onclick="showRegister()">Register</span>
      </div>
    </div>

    <div id="registerSection" style="display:none;">
      <h2>Create account</h2>
      <p>Register as a patient</p>

      <input id="registerName" placeholder="Full name" />
      <input id="registerEmail" type="email" placeholder="Email" />

      <div class="password-wrapper">
        <input id="registerPassword" type="password" placeholder="Password" />
        <button
          type="button"
          class="password-toggle"
          id="toggleRegisterPassword"
          onclick="togglePassword('registerPassword','toggleRegisterPassword')"
        >
          Show
        </button>
      </div>

      <input id="registerPhone" placeholder="Phone number" />

      <button id="registerBtn" onclick="registerPatient()">
        Register
      </button>

      <div class="switch">
        Already have an account?
        <span onclick="showLogin()">Login</span>
      </div>
    </div>

  </div>

  <script src="auth.js"></script>

  <script>
    function showRegister() {
      document.getElementById("loginSection").style.display = "none";
      document.getElementById("registerSection").style.display = "block";
    }

    function showLogin() {
      document.getElementById("registerSection").style.display = "none";
      document.getElementById("loginSection").style.display = "block";
    }
  </script>
</body>
</html>
