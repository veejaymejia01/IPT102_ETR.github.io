<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CareFlow - Patient Dashboard</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-shell">
    <!-- Sidebar -->
    <div class="sidebar">
      <div class="brand">
        <div class="brand-icon">●</div>
        <div>
          <h1>CareFlow</h1>
          <p>Patient Portal</p>
        </div>
      </div>
      <div class="nav-list">
        <button class="nav-btn active" onclick="showPatientPage('dashboard', this)">Dashboard</button>
        <button class="nav-btn" onclick="showPatientPage('book', this)">Book Appointment</button>
        <button class="nav-btn" onclick="showPatientPage('appointments', this)">My Appointments</button>
        <button class="nav-btn" onclick="showPatientPage('profile', this)">My Profile</button>
      </div>
      <button onclick="logout()" class="logout-btn">Logout</button>
    </div>

    <div class="main">
      <!-- Dashboard -->
      <section id="dashboard">
        <div class="page-hero">
          <div>
            <h2>Welcome, <span id="patientName">Patient</span></h2>
            <p>Manage your appointments easily</p>
          </div>
        </div>
        <div id="nextAppointmentBox" class="panel">Loading...</div>
      </section>

      <!-- Book Appointment -->
      <section id="book" class="hidden">
        <div class="panel">
          <h3>Book New Appointment</h3>

          <label>Specialization</label>
          <select id="specializationSelect" onchange="loadDoctorsBySpecialization()" class="full-width">
            <option value="">Select Specialization</option>
          </select>

          <label>Doctor</label>
          <select id="doctorSelect" class="full-width">
            <option value="">Select Doctor</option>
          </select>

          <label>Date & Time</label>
          <input type="datetime-local" id="appointmentDate" class="full-width">

          <div id="patientTimeSlots" class="time-grid"></div>

          <button onclick="bookAppointment()" class="btn btn-primary">Book Appointment</button>
          <p id="patientScheduleStatus" class="email-status"></p>
        </div>
      </section>

      <!-- My Appointments -->
      <section id="appointments" class="hidden">
        <div class="panel">
          <h3>My Appointments</h3>
          <table id="appointmentTable">
            <tr><th>Date</th><th>Doctor</th><th>Status</th></tr>
          </table>
        </div>
      </section>

      <!-- Profile -->
      <section id="profile" class="hidden">
        <div class="panel" id="profileBox">Loading profile...</div>
      </section>
    </div>
  </div>

  <script src="patient.js"></script>
</body>
</html>
