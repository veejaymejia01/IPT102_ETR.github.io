<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Patient Registration</title><link rel="stylesheet" href="style.css"></head><body class="login-body"><section class="login-screen"><div class="login-side"><div class="brand-chip">● Patient Registration</div><h1 class="hero-title">Create your patient portal account.</h1><p class="hero-text">Register to book appointments, view your schedule, and receive email confirmations directly from the healthcare portal.</p></div><div class="login-panel-wrap"><div class="login-panel"><h2>Create account</h2><p class="subtle">Complete the form to create your patient account.</p><div class="field"><label>Full Name</label><input id="registerName" placeholder="Juan Dela Cruz"></div><div class="field"><label>Email</label><input id="registerEmail" type="email" placeholder="patient@email.com"></div><div class="field"><label>Password</label><input id="registerPassword" type="password" placeholder="Create a password"></div><div class="field"><label>Phone</label><input id="registerPhone" placeholder="09171234567"></div><button class="btn btn-primary full-btn" onclick="registerPatient()">Register</button><div id="registerError" class="login-error"></div><div class="auth-links">Already have an account? <a href="index.html">Sign in</a></div></div></div></section><script src="auth.js"></script></body></html>
